name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # se actualiza cada 12 horas
  workflow_dispatch:          # permite ejecutarlo a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E0AC69&color_dots=#ebedf0,#FFDBAC,#F1C27D,#C68642,#8D5524
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E0AC69&color_dots=#161b22,#FFDBAC,#F1C27D,#C68642,#8D5524

      - uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
